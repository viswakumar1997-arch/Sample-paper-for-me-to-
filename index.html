<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subburaj & Seetha Wedding Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f140d;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            text-align: center;
        }

        /* 1. Banana Leaf Opening Intro Overlay */
        #introScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0a0e08;
            transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out, visibility 1.2s;
        }

        /* Banana Leaf Background Image */
        .intro-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1.5s ease-in-out;
        }

        /* Middle Custom Overlay Content */
        .intro-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .branding-initials {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: #f3e5ab;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.8), 2px 2px 5px rgba(0,0,0,0.9);
            letter-spacing: 2px;
        }

        .open-btn {
            background: linear-gradient(135deg, #d4af37, #f3e5ab, #aa8228);
            color: #1a1a1a;
            border: none;
            padding: 16px 45px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Cinzel', serif;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), 0 0 15px rgba(212, 175, 55, 0.5);
            transition: all 0.3s ease;
            animation: pulse 2s infinite;
        }

        .open-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.8);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Leaf Opening & Fade Out Class */
        #introScreen.open-animation {
            opacity: 0;
            visibility: hidden;
        }

        #introScreen.open-animation .intro-bg {
            transform: scale(1.3);
        }

        /* 2. Main Invitation Content Screen */
        .main-wrapper {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.5s ease 0.5s, transform 1.5s ease 0.5s;
            padding: 60px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .main-wrapper.show {
            opacity: 1;
            transform: translateY(0);
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 40px 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: #d4af37;
            margin: 20px 0;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .details-title {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: #f3e5ab;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .date-box {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
            margin: 15px 0;
            padding: 10px;
            border-top: 1px solid rgba(212,175,55,0.3);
            border-bottom: 1px solid rgba(212,175,55,0.3);
            display: inline-block;
        }

        .venue {
            font-size: 1.1rem;
            color: #cccccc;
            margin-top: 10px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- 1. Opening Screen Overlay -->
    <div id="introScreen">
        <!-- நீங்கள் குறிப்பிட்ட படம் '1791710518047.jpg' -->
        <img src="1791710518047.jpg" alt="Banana Leaf Background" class="intro-bg">
        <div class="intro-content">
            <div class="branding-initials">S & S</div>
            <button class="open-btn" id="openBtn">OPEN INVITATION</button>
        </div>
    </div>

    <!-- 2. Main Wedding Invitation Content -->
    <div class="main-wrapper" id="mainContent">
        <div class="card">
            <p style="letter-spacing: 3px; color: #d4af37; font-size: 0.9rem;">TOGETHER WITH THEIR FAMILIES</p>
            <h1 class="names">Subburaj & Seetha</h1>
            <p style="font-size: 1.1rem; color: #ddd;">INVITE YOU TO CELEBRATE THEIR WEDDING</p>
            
            <div class="date-box">
                20 - 21 NOVEMBER 2026
            </div>

            <div class="details-title" style="margin-top: 25px;">VENUE</div>
            <div class="venue">
                <strong>Deva Kalyana Mandapam</strong><br>
                Grand Marriage Hall
            </div>
        </div>
    </div>

    <!-- Background Music (audio.mp3) -->
    <audio id="bgMusic" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <script>
        document.getElementById("openBtn").addEventListener("click", function() {
            const introScreen = document.getElementById("introScreen");
            const mainContent = document.getElementById("mainContent");
            const bgMusic = document.getElementById("bgMusic");

            // 1. வாழையிலை விரிந்து மறையும் அனிமேஷன் இயங்குதல்
            introScreen.classList.add("open-animation");

            // 2. உள்ளே இருக்கும் மெயின் அழைப்பிதழ் வெளிப்படுதல்
            mainContent.classList.add("show");

            // 3. பின்னணி இசை இயங்குதல்
            if (bgMusic) {
                bgMusic.play().catch(function(error) {
                    console.log("Audio autoplay restriction: ", error);
                });
            }
        });
    </script>
</body>
</html>
